# Portable architecture template; legacy dataset paths below are placeholders.
# Current v2 inference must use the matching 03_weights/resolved_config.yaml.
random_seed: 444

dataset:
  Name: ['Rcooper','Rope3D','MIX']
  type: &dataset_type 'Mono3DRefer' #dont change this
  root_img_dir: [
    'data/legacy_rcooper/image/',
    'data/legacy_v2x/img'

  ]    #The V2X SEQ directory contains the infrastructure-side folder.
  root_dir: 'legacy'          #The Mono3DVG\Mono3DRefer path of the script you downloaded contains #only the txt file
  video_dir: 'data/legacy_video'  #This is your video json path. Each json represents a video with 30 frames.  
  Rcooper_vedio: 'data/legacy_rcooper/video_label'
  calib_path: [
    'data/legacy_rcooper/calib/camera_intrinsic/',
    'data/legacy_v2x/calib/camera_intrinsic/'
  ]
  Rope3D_vedio: 'data/legacy_v2x/video/sequence_0042'
  train_split: 'train'
  val_split: 'test'
  test_split: 'test'
  batch_size: 1
  use_3d_center: True
  bbox2d_type: 'anno'
  meanshape: False
  clip_2d: False

  aug_pd: True
  aug_crop: True

  random_flip: 0.5
  random_crop: 0.5
  scale: 0.05
  shift: 0.05

model_name: 'mono3dvg'

model:
  num_classes: 4
  return_intermediate_dec: True
  device: 'cuda'

  # Backbone

  use_timm_backbone: True
  backbone: 'swin_large_patch4_window7_224'
  swin_use_pretrained_backbone: True
  num_channels: 3
  pretrained_backbone_path: 'weights/legacy_backbone/model.safetensors'     # 'pretrained-models/swin_large_patch4_window7_224/model.safetensors'
  num_feature_levels: 4
  freeze_backbone: False



  # backbone: 'resnet50'
  train_backbone: True
  # num_feature_levels: 4
  dilation: False
  position_embedding: 'sine'  # 'sine' or 'learned'
  masks: False

  # Depth predictor
  mode: LID
  num_depth_bins: 80
  depth_min: 1e-3
  depth_max: 60.0

  # Transformer
  with_box_refine: True
  two_stage: False
  init_box: False
  enc_layers: 3
  dec_layers: 1
  hidden_dim: 256
  dim_feedforward: 256
  dropout: 0.1
  nheads: 8
  num_queries: 1
  enc_n_points: 4
  dec_n_points: 4
  freeze_text_encoder: True

  # Loss
  aux_loss: False

  # Loss coefficients
  cls_loss_coef: 2
  focal_alpha: 0.25

  bbox_loss_coef: 5
  giou_loss_coef: 2
  3dcenter_loss_coef: 10
  dim_loss_coef: 1
  angle_loss_coef: 1
  depth_loss_coef: 1
  depth_map_loss_coef: 1

  # Matcher
  set_cost_class: 2
  set_cost_bbox: 5
  set_cost_giou: 2
  set_cost_3dcenter: 10


optimizer:
  type: 'adamw'
  lr: 0.0002 # 0.00005
  weight_decay: 0.0002 # 0.00005


lr_scheduler:
  type: 'step'  # 'step' or 'cos'
  warmup: True  # 5 epoches, cosine warmup, init_lir=0.00001 in default
  decay_rate: 0.1
  decay_list: [40]


trainer:
  max_epoch: 20
  gpu_ids: '1'
  detr_model: 'legacy/configs/checkpoint_best_MonoDETR.pth'
  save_frequency: 1    # checkpoint save interval (in epoch)
  resume_model: False
  pretrain_model: False
  save_path: 'legacy/outputs/mono3dvg_swindiff_ttm2/'

tester:
  type: *dataset_type
  checkpoint: 195  # the start ckpt epoch for 'all'
  threshold: 0.0  # confidence filter
  topk: 1
  pretrain_model: 'weights/legacy_model.pth' # 'configs\checkpoint_best.pth'
